name: CI

on:
    pull_request:
    push:
        branches: [main]

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install
              run: npm ci

            - name: Typecheck
              run: npm run typecheck

            - name: Format
              run: npm run format:check

            - name: Lint
              run: npm run lint

            - name: Build
              run: npm run build
